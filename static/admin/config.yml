backend:
  name: git-gateway
  branch: main

# Permet editar en local (`npx decap-server`) sense passar per git-gateway.
local_backend: true

publish_mode: editorial_workflow

media_folder: "static/img/uploads"
public_folder: "/img/uploads"

site_url: https://naubostik.netlify.app
display_url: https://naubostik.netlify.app
logo_url: /img/logos/logo.png

collections:
  - name: "noticies"
    label: "Notícies"
    folder: "content/noticies"
    create: true
    slug: "{{slug}}"
    format: "toml-frontmatter"
    fields:
      - { label: "Títol", name: "title", widget: "string" }
      - { label: "Data", name: "date", widget: "datetime" }
      - { label: "Esborrany (no publicat)", name: "draft", widget: "boolean", default: false }
      - { label: "Cos", name: "body", widget: "markdown" }

  - name: "activitats"
    label: "Activitats"
    folder: "content/activitats"
    create: true
    slug: "{{slug}}"
    format: "toml-frontmatter"
    fields:
      - { label: "Títol", name: "title", widget: "string" }
      - { label: "Data", name: "date", widget: "datetime" }
      - { label: "Entitat organitzadora (buit = programació pròpia)", name: "entitat", widget: "string", required: false }
      - { label: "Esborrany (no publicat)", name: "draft", widget: "boolean", default: false }
      - { label: "Cos", name: "body", widget: "markdown" }

  - name: "espais"
    label: "Espais"
    folder: "content/espais"
    create: true
    slug: "{{slug}}"
    format: "toml-frontmatter"
    fields:
      - { label: "Títol", name: "title", widget: "string" }
      - { label: "Data", name: "date", widget: "datetime" }
      - label: "Ubicació"
        name: "ubicacio"
        widget: "select"
        options: ["Planta baixa", "Primera Planta", "Segona Planta", "Tercera Planta"]
        required: false
      - { label: "Cedible per lloguer", name: "cedible", widget: "boolean", default: false }
      - { label: "Esborrany (no publicat)", name: "draft", widget: "boolean", default: false }
      - { label: "Logo", name: "logo", widget: "image", required: false }
      - { label: "Fotografies", name: "fotografies", widget: "list", field: { label: "Imatge", name: "imatge", widget: "image" }, required: false }
      - { label: "Plànol", name: "plano", widget: "image", required: false }
      - { label: "Correu de contacte", name: "mail", widget: "string", required: false }
      - { label: "Web", name: "web", widget: "string", required: false }
      - label: "Xarxes socials"
        name: "xarxes"
        widget: "list"
        required: false
        fields:
          - { label: "Nom", name: "nom", widget: "string" }
          - { label: "URL", name: "url", widget: "string" }
      - { label: "Cos", name: "body", widget: "markdown" }

  - name: "collectius"
    label: "Col·lectius"
    folder: "content/collectius"
    create: true
    slug: "{{slug}}"
    format: "toml-frontmatter"
    fields:
      - { label: "Títol", name: "title", widget: "string" }
      - { label: "Data", name: "date", widget: "datetime" }
      - { label: "Esborrany (no publicat)", name: "draft", widget: "boolean", default: false }
      - { label: "Cos", name: "body", widget: "markdown" }

  - name: "pages"
    label: "Pàgines institucionals"
    format: "toml-frontmatter"
    files:
      - label: "Inici"
        name: "inici"
        file: "content/_index.md"
        fields:
          - { label: "Títol", name: "title", widget: "string" }
          - { label: "Descripció", name: "description", widget: "string", required: false }
          - { label: "Cos", name: "body", widget: "markdown" }
      - label: "Qui som"
        name: "qui-som"
        file: "content/qui-som/_index.md"
        fields:
          - { label: "Títol", name: "title", widget: "string" }
          - { label: "Cos", name: "body", widget: "markdown" }
      - label: "Contacte"
        name: "contacte"
        file: "content/contacte/_index.md"
        fields:
          - { label: "Títol", name: "title", widget: "string" }
          - { label: "Cos", name: "body", widget: "markdown" }
      - label: "Cessió d'espais"
        name: "cessio-despais"
        file: "content/cessio-despais.md"
        fields:
          - { label: "Títol", name: "title", widget: "string" }
          - { label: "Cos", name: "body", widget: "markdown" }
