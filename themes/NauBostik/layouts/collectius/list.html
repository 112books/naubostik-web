{{ define "main" }}
<div class="page-header">
  <h1>{{ i18n "collectius_title" }}</h1>
  {{ with i18n "collectius_lead" }}<p class="lead">{{ . }}</p>{{ end }}
</div>

<div class="col-logo-grid">
  {{ range .Pages.ByTitle }}
  <a href="{{ .RelPermalink }}" class="col-logo-card" title="{{ .Title }}">
    <div class="col-logo-card__img">
      {{ if .Params.logo }}
      <img src="{{ .Params.logo | strings.TrimPrefix "/" | relURL }}" alt="{{ .Title }}" loading="lazy">
      {{ else }}
      <span class="col-logo-card__fallback">{{ .Title }}</span>
      {{ end }}
    </div>
    <p class="col-logo-card__name">{{ .Title }}</p>
  </a>
  {{ end }}
</div>
{{ end }}
