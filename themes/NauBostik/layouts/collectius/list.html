{{ define "main" }}
<div class="page-header">
  <h1>{{ i18n "collectius_title" }}</h1>
  <p class="lead">{{ i18n "collectius_lead" }}</p>
</div>

<div class="grid-3">
  {{ range .Paginator.Pages }}
  <div class="card">
    <h3><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h3>
    <p>{{ .Summary }}</p>
  </div>
  {{ end }}
</div>

{{ template "_internal/pagination.html" . }}
{{ end }}
