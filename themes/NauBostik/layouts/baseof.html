<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode | default "ca" }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .Title }}{{ .Title }} | {{ end }}{{ site.Title }}</title>
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta http-equiv="X-Robots-Tag" content="noindex, nofollow, noarchive">
  <link rel="stylesheet" href="{{ "css/main.css" | relURL }}">
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js" defer></script>
</head>
<body>
  <div class="wrapper">
    {{ if and .IsHome (default true site.Params.showTicker) }}
    <div class="ticker-bar" role="banner" aria-label="{{ i18n "ticker_aria" }}">
      <div class="container">
        {{ with index .Site.Data "slogans" }}
        <div class="ticker-track{{ if gt (len .slogans) 1 }} ticker-track-multi{{ end }}">
          {{ range .slogans }}
          <span class="ticker-item"><span class="ticker-fist" aria-hidden="true">&#9994;</span>{{ . }}</span>
          <span class="ticker-item ticker-item-clone" aria-hidden="true"><span class="ticker-fist" aria-hidden="true">&#9994;</span>{{ . }}</span>
          {{ end }}
        </div>
        {{ end }}
      </div>
    </div>
    {{ end }}
    <header class="site-header">
      {{ partial "header.html" . }}
    </header>
    <main class="container">
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
  </div>
  <button class="scroll-top" type="button" aria-label="{{ i18n "scroll_top" }}" title="{{ i18n "scroll_top" }}">
    <svg class="scroll-top-progress" viewBox="0 0 48 48" aria-hidden="true">
      <circle class="scroll-top-track" cx="24" cy="24" r="22"></circle>
      <circle class="scroll-top-bar" cx="24" cy="24" r="22"></circle>
    </svg>
    <svg class="scroll-top-arrow" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 5l7 7h-4v7H9v-7H5z"></path>
    </svg>
  </button>
  <script src="{{ "js/main.js" | relURL }}"></script>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
