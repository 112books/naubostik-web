<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode | default "ca" }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .Title }}{{ .Title }} | {{ end }}{{ site.Title }}</title>
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta http-equiv="X-Robots-Tag" content="noindex, nofollow, noarchive">
  <link rel="stylesheet" href="{{ "css/main.css" | relURL }}">
</head>
<body>
  <div class="wrapper">
    <div class="claim-bar" role="banner" aria-label="Lema de la nau">
      <div class="container">
        <p class="claim-bar-text"><span class="claim-bar-fist" aria-hidden="true">&#9994;</span> La Sagrera necessita més un centre cultural que una estació d'Alta Velocitat.</p>
      </div>
    </div>
    <header class="site-header">
      {{ partial "header.html" . }}
    </header>
    <main class="container">
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
  </div>
  <script src="{{ "js/main.js" | relURL }}"></script>
</body>
</html>
