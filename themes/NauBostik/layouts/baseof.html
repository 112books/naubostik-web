<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode | default "ca" }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .Title }}{{ .Title }} | {{ end }}{{ site.Title }}</title>
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta http-equiv="X-Robots-Tag" content="noindex, nofollow, noarchive">
  <link rel="stylesheet" href="{{ "css/main.css" | relURL }}">
</head>
<body>
  <div class="wrapper">
    <div class="ticker-bar" role="banner" aria-label="Lema de la nau">
      <div class="container">
        {{ with index .Site.Data "slogans" }}
        <div class="ticker-track{{ if gt (len .slogans) 1 }} ticker-track-multi{{ end }}">
          {{ range .slogans }}
          <span class="ticker-item"><span class="ticker-fist" aria-hidden="true">&#9994;</span>{{ . }}</span>
          <span class="ticker-item ticker-item-clone" aria-hidden="true"><span class="ticker-fist" aria-hidden="true">&#9994;</span>{{ . }}</span>
          {{ end }}
        </div>
        {{ end }}
      </div>
    </div>
    <header class="site-header">
      {{ partial "header.html" . }}
    </header>
    <main class="container">
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
  </div>
  <script src="{{ "js/main.js" | relURL }}"></script>
</body>
</html>
